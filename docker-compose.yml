# Local infrastructure.
#   docker compose up -d db                 # PostgreSQL only (recommended for development)
#   docker compose --profile app up --build # PostgreSQL + API + web app
# Values come from .env (copy .env.example). Never commit a real .env.
# Host ports can be overridden (e.g. POSTGRES_HOST_PORT=5433) if something on the
# host already listens on 5432/8000/8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warranty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-warranty_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-warranty}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-warranty_db}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_ENV: ${APP_ENV:-development}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      MODEL_ARTIFACT_DIR: /data/model_artifacts
    volumes:
      - artifacts:/data/model_artifacts
    ports:
      - "${API_HOST_PORT:-8000}:8000"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  pgdata:
  artifacts:
